    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-red: #ff003c;
            --neon-purple: #9d00ff;
            --bg-dark: #080808;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Titles */
        .main-header { font-size: 2.2rem; font-weight: 900; letter-spacing: 6px; color: white; margin-bottom: 5px; text-shadow: 0 0 15px var(--neon-purple); }
        .sub-header { font-size: 1rem; color: var(--neon-red); margin-bottom: 30px; letter-spacing: 3px; font-weight: 500; }

        /* Neon Running Border Box */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 750px;
            padding: 5px; /* Border thickness */
            background: linear-gradient(0deg, #000, #222);
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* The Running Light Effect */
        .video-wrapper::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, var(--neon-red), var(--neon-purple), transparent 30%);
            animation: rotateBorder 4s linear infinite;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            z-index: 2;
        }

        video { width: 100%; display: block; cursor: pointer; border-radius: 20px; }

        /* Icon Overlay Logic */
        .status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
        }
        .status-overlay.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Glass Controls UI */
        .controls-shelf {
            margin-top: 40px; /* Big gap from video */
            display: flex;
            align-items: center;
            gap: 25px;
            background: rgba(20, 20, 20, 0.8);
            padding: 15px 40px;
            border-radius: 20px;
            border-bottom: 2px solid var(--neon-purple);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .ctrl-btn {
            font-size: 1.4rem;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }
        .ctrl-btn:hover { color: var(--neon-red); transform: scale(1.2); }

        /* Bottom Grid Buttons */
        .link-section {
            margin-top: 60px; /* Pushed way down */
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 750px;
        }

        .neon-link {
            padding: 18px;
            background: #111;
            border-left: 4px solid var(--neon-red);
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .neon-link:hover {
            background: var(--neon-red);
            color: black;
            box-shadow: 0 0 20px var(--neon-red);
        }
        
        
        
        
        
        
        
        
        .log-container {
    width: 350px;
    background: #000;
    border: 2px solid #ff0055; /* Neon Red */
    border-radius: 10px;
    padding: 15px;
    font-family: 'Courier New', Courier, monospace;
    box-shadow: 0 0 15px #ff0055, inset 0 0 10px #7a00ff; /* Neon Red & Purple Glow */
    margin: 20px auto;
}

.log-header {
    color: #fff;
    font-weight: bold;
    text-align: center;
    margin-bottom: 10px;
    text-shadow: 0 0 5px #7a00ff;
}

.dot {
    height: 10px;
    width: 10px;
    background-color: #0f0;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px #0f0;
    animation: blink 1s infinite;
}

.log-box {
    height: 150px;
    overflow: hidden; /* Excess logs hide panna */
    border-top: 1px solid #333;
    padding-top: 10px;
}

.log-content {
    color: #bc13fe; /* Neon Purple */
    font-size: 13px;
    line-height: 1.6;
    text-shadow: 0 0 5px #bc13fe;
}

@keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
}

    </style>
</head>
<body>

    <div class="main-header">PROXY SERVER SETUP</div>
    <div class="sub-header">Leader Botz</div>

    <div class="video-wrapper">
        <div class="video-container" id="vContainer">
            <video id="mainVideo" poster="hq720.jpg">
                <source src="1000502104_534x240.mp4" type="video/mp4">

<div class="log-container">

    Leader botz video streaming server info

    <script>
        const video = document.getElementById('mainVideo');
        const statusIcon = document.getElementById('statusIcon');
        const playIcon = document.getElementById('playIcon');
        const muteIcon = document.getElementById('muteIcon');
        const vContainer = document.getElementById('vContainer');

        let isIconVisible = false;
        let hideTimer;

        // Custom Logic: Single tap shows icon, second tap pauses
        vContainer.addEventListener('click', () => {
            if (!isIconVisible) {
                // First tap: Just show the icon
                showOverlay();
            } else {
                // Second tap: Perform the action
                togglePlay();
            }
        });

        function showOverlay() {
            statusIcon.classList.add('active');
            isIconVisible = true;
            
            // Update the icon based on state
            statusIcon.innerHTML = video.paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';

            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                statusIcon.classList.remove('active');
                isIconVisible = false;
            }, 2000);
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
                playIcon.className = "fas fa-pause ctrl-btn";
            } else {
                video.pause();
                playIcon.className = "fas fa-play ctrl-btn";
            }
            // Refresh overlay to show new state
            showOverlay();
        }

        function skip(val) {
            video.currentTime += val;
        }

        function toggleMute() {
            video.muted = !video.muted;
            muteIcon.className = video.muted ? "fas fa-volume-mute ctrl-btn" : "fas fa-volume-up ctrl-btn";
        }
        
        
        
        
        
        
        
        const logContent = document.getElementById('logContent');

const messages = [
    "> Connecting to global server...",
    "> Server online: Port 8080",
    "> Video streaming started...",
    "> Buffering data packets...",
    "> Connection encrypted (SSL/TLS)",
    "> Live stream: 1080p Active",
    "> Ping: 24ms",
    "> Syncing video frames..."
];

function addLog() {
    // Message create pannuthu
    const newLog = document.createElement('div');
    const randomMsg = messages[Math.floor(Math.random() * messages.length)];
    const timestamp = new Date().toLocaleTimeString();
    
    newLog.textContent = `[${timestamp}] ${randomMsg}`;
    
    // Log box kulla add pannuthu
    logContent.prepend(newLog);

    // Romba logs vantha pathaiye delete pannum (Memory efficiency-kku)
    if (logContent.children.length > 8) {
        logContent.removeChild(logContent.lastChild);
    }
}

// Ovvoru 1.5 seconds-kkum log update aagum
setInterval(addLog, 1500);

    </script>
</body>
